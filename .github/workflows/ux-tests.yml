name: Verificação de UX e lógica
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript principal
        run: node --check src/app.js
      - name: Executar testes
        run: npm test
      - name: Preparar Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Instalar driver do teste visual
        run: npm install --no-save playwright-core
      - name: Validar fluxos móveis no navegador
        run: node tests/ux-smoke.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
