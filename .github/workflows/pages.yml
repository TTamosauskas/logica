name: LogicLab - testes e GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe da aplicação
        run: node --check src/app.js
      - name: Executar testes unitários
        run: npm test
      - name: Preparar Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Preparar Playwright para testes de interface
        run: npm install --no-save playwright-core
      - name: Testar navegação e UX no Chromium
        run: node tests/ux-smoke.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
